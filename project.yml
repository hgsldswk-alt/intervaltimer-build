name: IntervalTimer
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.intervaltimer
    APP_STORE_ID: "6836672658"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  IntervalTimer:
    type: application
    platform: iOS
    sources: [IntervalTimer, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: IntervalTimer AppStore
    info:
      path: IntervalTimer/Info.plist
      properties:
        CFBundleDisplayName: 训练间歇计时
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: 将你选择保存的训练成绩图添加到照片。
        APP_STORE_ID: $(APP_STORE_ID)
        IntervalProProductID: $(APP_ID).pro
        IntervalTrialProductID: $(APP_ID).trial
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Interval Plan
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.intervaltimer.plan]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.intervaltimer.plan
            UTTypeDescription: Interval Plan
            UTTypeConformsTo: [public.json, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [intervalplan]
              public.mime-type: [application/vnd.intervaltimer.plan+json]
  IntervalTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IntervalTimerTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  IntervalTimerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [IntervalTimerUITests]
    dependencies:
      - target: IntervalTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IntervalTimer
schemes:
  IntervalTimer:
    build:
      targets:
        IntervalTimer: all
        IntervalTimerTests: [test]
    test:
      config: Debug
      targets: [IntervalTimerTests]
  IntervalTimerUI:
    build:
      targets:
        IntervalTimer: all
        IntervalTimerUITests: [test]
    test:
      config: Debug
      targets: [IntervalTimerUITests]
      gatherCoverageData: false
